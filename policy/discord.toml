# The Discord provider's fixed values (docs/discord.md). The words a person reads are in `lang/ko.toml`.

# What the provider sends, as its declaration's `can`.
can = ["text", "replyTo", "photo", "document", "sticker", "reaction", "pin", "typing", "edit"]

# Discord's terms forbid automating a user account. `own-account`, on an account made for the agent, is declared
# unsupported with the terms' own words as its reason; the owner's own account runs on his own settings and at
# his own risk (docs/discord.md, 「The owner's account」).
user_accounts = "Automating normal user accounts (generally called \"self-bots\") outside of the OAuth2/bot API is forbidden, and can result in an account termination if found."

# The least time, in milliseconds, between one call on the owner's account ending and the next starting, where
# `BMO_DISCORD_OWNER_PACE_MS` does not name one.
owner_pace_ms = 2000

# How often, in milliseconds, the gateway confirms the owner's account with Discord after the first time, as it
# starts (docs/discord.md, 「The owner's account」).
owner_confirm_ms = 600000

# The ranges this provider assigns numbers in, both ends included, held clear of the ranges other chat
# providers declare. Rooms count down from `last`; people count up from `first`.
[numbering.rooms]
first = -8999999999999
last = -8000000000000

[numbering.people]
first = 8000000000000
last = 8999999999999

# The `discord-markdown` dialect: the longest one message and one caption hold, in characters (a longer answer
# goes out as consecutive messages, cut at its own markdown's seams), the most embeds one message carries, the
# largest file a guild with no boost takes, and what a writer in such a room is told its marks become.
[dialect]
name = "discord-markdown"
text_limit = 2000
album_photos = 10
file_bytes = 26214400
writing = "This room reads markdown itself: bold, italic, strikethrough, spoilers, inline code, code blocks and quotes all show as marks, and nothing is converted or escaped on the way out. Nothing is folded here, and a message longer than two thousand characters goes out as consecutive messages."
