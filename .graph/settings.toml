repository = "bmo-discord"
base = false

[coverage]
# The package's src/, the gateway's own bun package and the tools that generate its seam clients, but these:
# the crate's root, which only lists its modules, and the gateway's declaration of what a TOML import is.
layout = "bmo-next"
roots = ["gateway/", "tools/"]
unindexed = ["src/lib.rs", "gateway/src/toml.d.ts"]
