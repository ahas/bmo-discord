# The Discord provider service: one package at the root. The gateway in `gateway/` is a bun package, outside
# Cargo.
[package]
name = "bmo-discord"
description = "The Discord chat provider: the declaration, the discord-markdown dialect and the protocol's routes, with the gateway behind them."
version = "0.1.0-rev.1"
edition = "2024"
license = "MIT"
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
bmo-chat = { path = "../../base/chat/provider" }
bmo-text = { path = "../../base/text", default-features = false }
# The service binary's verbs.
clap = { version = "4.5.40", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# The gateway and the served service's own health are reached over the loopback, with no TLS; the receiver
# is reached through bmo-chat's link.
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
# The repository-wide personal-data check reads every tracked file for the patterns PERSONAL-DATA.md states.
regex = "1.13.1"

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
