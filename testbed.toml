# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format. The
# Cargo suite is the service's package; the bun suite is the gateway in `gateway/`. The quick checks
# hold the personal-data rule (PERSONAL-DATA.md); the behaviour tests are deferred (README.md).

testbed = 0
name = "discord"

[test]
languages = ["cargo", "bun"]
setup = ["cd gateway && bun install --frozen-lockfile"]

[check]
quick = ["layout", "dependencies", "korean", "cargo-profile", "shared-versions", "personal-data"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-text"]
# No code file is allowed a Korean line. The words a person reads stand in the packs under `lang/`, which are not code.
korean_ledger = "korean-ledger.json"

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the service. The testbed's own Cargo workspace check formats and lints the
# package, every target compiled, through its Cargo verb in the shared build directory, wherever a change marks
# it, and the change check compiles every crate a change marks; a change that marks none has no Rust to judge.
# The one declared step is the gateway's type check, which the testbed does not run on its own.
[[check.step]]
id = "gateway-types"
command = "./node_modules/.bin/tsc --noEmit"
dir = "gateway"
when = ["gateway/**", "policy/**", "lang/**", "docs/openapi.json"]

[build]
# The service's binary; the gateway is a bun package run from the release's gateway/, which the setup steps
# install, not a Cargo binary.
binaries = ["bmo-discord"]

# The provider's deploy tree, and the data root it shares with the services that read its files. The env file
# both processes read is linked into the release (docs/boundary-api.md, 「Configuration」); the service's unit
# carries the bot mark and the gateway's the restart mark.
[deploy]
root = "~/.local/share/bmo-discord"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "discord.env", target = "env/discord.env" }]
units = ["deploy/*.service"]
# Answers 0 once the service's own /health says ready, in the environment the release links.
health = "set -a; . ~/.local/share/bmo-discord/deploy/discord.env; ~/.local/share/bmo-discord/deploy/bin/bmo-discord health"
